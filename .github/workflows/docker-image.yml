name: Docker Image

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Dockerfile to build (Dockerfile for the App, API.Dockerfile for the API)
        required: true
        type: string
      tags:
        description: Image tags to push, one per line (e.g. axelander/openbudgeteer:1.12)
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build and Push
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.tags }}
          platforms: linux/arm64,linux/amd64
