name: Docker Image (Release)

on:
  push:
    tags:
      - "[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

# Run releases one after another so the "latest" check always sees a consistent state
concurrency:
  group: docker-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    name: Validate Version
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-latest: ${{ steps.version.outputs.is-latest }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required to compare against all existing tags

      - name: Validate version and determine latest
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME}"

          if ! grep -qF "Version: ${VERSION} (" OpenBudgeteer.Blazor/Shared/MainLayout.razor; then
            echo "::error file=OpenBudgeteer.Blazor/Shared/MainLayout.razor::Version in MainLayout.razor does not match tag ${VERSION}"
            exit 1
          fi

          if ! awk -v ver="${VERSION}" '/^## / && $2 == ver { found=1 } END { exit !found }' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No section '## ${VERSION}' found in CHANGELOG.md"
            exit 1
          fi

          # Only the highest version gets "latest", so hotfixes for older versions don't replace it
          HIGHEST=$(git tag -l | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -n 1)
          IS_LATEST=$([ "${VERSION}" = "${HIGHEST}" ] && echo true || echo false)

          echo "Version: ${VERSION}, highest tag: ${HIGHEST}, latest: ${IS_LATEST}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is-latest=${IS_LATEST}" >> "$GITHUB_OUTPUT"

  test:
    name: Run Test Cases
    needs: preflight
    uses: ./.github/workflows/test.yml

  deploy-docker-app:
    runs-on: ubuntu-latest
    name: Build and Push Docker Image (App)
    needs: [ preflight, test ]
    if: success()
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            axelander/openbudgeteer:${{ needs.preflight.outputs.version }}
            ${{ needs.preflight.outputs.is-latest == 'true' && 'axelander/openbudgeteer:latest' || '' }}
          platforms: linux/arm64,linux/amd64

  deploy-docker-api:
    runs-on: ubuntu-latest
    name: Build and Push Docker Image (API)
    needs: [ preflight, test ]
    if: success() && needs.preflight.outputs.is-latest == 'true'
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: axelander/openbudgeteer-api:latest
          file: API.Dockerfile
          platforms: linux/arm64,linux/amd64

  github-release:
    runs-on: ubuntu-latest
    name: Create GitHub Release
    needs: [ preflight, deploy-docker-app ]
    if: success()
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Create release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          IS_LATEST: ${{ needs.preflight.outputs.is-latest }}
        run: |
          if gh release view "${VERSION}" > /dev/null 2>&1; then
            echo "::notice::Release ${VERSION} already exists, skipping"
            exit 0
          fi

          awk -v ver="${VERSION}" '/^## / { if (found) exit; if ($2 == ver) { found=1; next } } found' CHANGELOG.md > release-notes.md

          gh release create "${VERSION}" \
            --verify-tag \
            --title "${VERSION}" \
            --notes-file release-notes.md \
            --latest="${IS_LATEST}"
