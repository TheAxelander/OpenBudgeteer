name: Docker Image (pre-release)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Only the newest build of main should publish the pre-release image
concurrency:
  group: docker-pre-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    name: Run Unit Tests
    uses: ./.github/workflows/unit-test.yml

  docker-app:
    name: Docker Image (App)
    needs: unit-test
    uses: ./.github/workflows/docker-image.yml
    with:
      dockerfile: Dockerfile
      tags: axelander/openbudgeteer:pre-release
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  docker-api:
    name: Docker Image (API)
    needs: unit-test
    uses: ./.github/workflows/docker-image.yml
    with:
      dockerfile: API.Dockerfile
      tags: axelander/openbudgeteer-api:pre-release
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
