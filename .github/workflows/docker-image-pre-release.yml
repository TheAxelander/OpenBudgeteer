name: Docker Image (pre-release)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Only the newest build of main should publish the pre-release image
concurrency:
  group: docker-pre-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Test Cases
    uses: ./.github/workflows/test.yml

  deploy-docker-app:
    runs-on: ubuntu-latest
    name: Build and Push Docker Image (App)
    needs: test
    if: success()
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: axelander/openbudgeteer:pre-release
          platforms: linux/arm64,linux/amd64
          
  deploy-docker-api:
    runs-on: ubuntu-latest
    name: Build and Push Docker Image (API)
    needs: test
    if: success()
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: axelander/openbudgeteer-api:pre-release
          file: API.Dockerfile
          platforms: linux/arm64,linux/amd64